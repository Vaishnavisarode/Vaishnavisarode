  <path d="M0 260 Q250 190 500 255 T1000 230 T1200 245" fill="none" stroke="#39D6B0" stroke-opacity=".25" stroke-width="2"/>
  <rect x="75" y="65" width="5" height="145" rx="3" fill="url(#accent)"/>
  <text x="110" y="125" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="52" font-weight="700">Vaishnavi Sarode</text>
  <text x="112" y="170" fill="#39D6B0" font-family="Arial, sans-serif" font-size="23" letter-spacing="2">DATA ANALYST  |  AI &amp; BI ENTHUSIAST</text>
  <text x="112" y="210" fill="#D3E4E0" font-family="Arial, sans-serif" font-size="17">Transforming Data Into Meaningful Business Insights</text>
  <g fill="#F28C45">
